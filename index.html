<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poker Trainer</title>
    <link rel="stylesheet" href="css/mesa.css" />
    <link rel="stylesheet" href="css/cartas.css" />
    <link rel="stylesheet" href="css/hud.css" />
  </head>
  <body>
    <!--
      THESIS: Reading is trained inside the club table, not as a school quiz beside the felt.
      OWN-WORLD: deep baize, mahogany rail, single spotlight, nocturnal action-bar HUD, classic index cards.
      STORY: sit, deal Nova mao, read the board, answer in the table HUD.
      FIRST VIEWPORT: oval felt; Voce larger at bottom; A/B on the arc; five center slots; HUD with Nova mao.
      FORM: Operate / private club — pinned by spec 001.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div class="clube" id="clube">
      <p class="aviso-file" hidden>
        Abra este treino via HTTP local (http://localhost:8080), nao como arquivo.
      </p>
      <div class="palco">
        <div class="rail" id="mesa">
          <div class="feltro">
            <div class="holofote" aria-hidden="true"></div>
            <div class="sapato" id="sapato" aria-hidden="true"></div>

            <div class="assento" data-seat="adversarioA">
              <div class="holes">
                <div class="hole-slot" data-hole="0"></div>
                <div class="hole-slot" data-hole="1"></div>
              </div>
              <div class="ident">
                <img
                  class="avatar"
                  src="assets/avatares/adversario-a.svg"
                  alt="Ficha ilustrada do Adversario A"
                  width="52"
                  height="52"
                />
                <div>
                  <p class="apelido">Advers&#225;rio A</p>
                  <div class="stack" aria-hidden="true">
                    <span class="ficha"></span>
                    <span class="ficha"></span>
                    <span class="ficha"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="assento" data-seat="adversarioB">
              <div class="holes">
                <div class="hole-slot" data-hole="0"></div>
                <div class="hole-slot" data-hole="1"></div>
              </div>
              <div class="ident">
                <img
                  class="avatar"
                  src="assets/avatares/adversario-b.svg"
                  alt="Ficha ilustrada do Adversario B"
                  width="52"
                  height="52"
                />
                <div>
                  <p class="apelido">Advers&#225;rio B</p>
                  <div class="stack" aria-hidden="true">
                    <span class="ficha"></span>
                    <span class="ficha"></span>
                    <span class="ficha"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="pote" data-pote data-modo="centro" aria-hidden="true">
              <div class="pote-grupo" data-para="comum">
                <span class="pote-chip"></span>
                <span class="pote-chip"></span>
                <span class="pote-chip"></span>
                <span class="pote-chip"></span>
              </div>
              <div class="pote-grupo" data-para="voce" hidden>
                <span class="pote-chip"></span>
                <span class="pote-chip"></span>
              </div>
              <div class="pote-grupo" data-para="adversarioA" hidden>
                <span class="pote-chip"></span>
                <span class="pote-chip"></span>
              </div>
            </div>

            <div class="board" aria-label="Cartas comunitarias">
              <div class="slot" data-slot="1"></div>
              <div class="slot" data-slot="2"></div>
              <div class="slot" data-slot="3"></div>
              <div class="slot" data-slot="4"></div>
              <div class="slot" data-slot="5"></div>
            </div>
            <div class="burn-area" data-burn></div>

            <div class="assento assento--heroi" data-seat="voce">
              <div class="holes">
                <div class="hole-slot" data-hole="0"></div>
                <div class="hole-slot" data-hole="1"></div>
              </div>
              <div class="ident">
                <img
                  class="avatar"
                  src="assets/avatares/voce.svg"
                  alt="Ficha ilustrada de Voce"
                  width="64"
                  height="64"
                />
                <div>
                  <p class="apelido">Voc&#234;</p>
                  <div class="stack" aria-hidden="true">
                    <span class="ficha"></span>
                    <span class="ficha"></span>
                    <span class="ficha"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="hud"
        id="hud"
        data-hud-estado="ociosa"
        aria-live="polite"
      >
        <p class="hud__linha">Treine ler as m&#227;os. Sem apostas.</p>
        <div class="hud__acoes">
          <button type="button" class="btn btn--cta" data-cta="Nova m&#227;o">Nova m&#227;o</button>
        </div>
      </div>
    </div>
    <script type="module" src="js/mesa.js"></script>
  </body>
</html>
